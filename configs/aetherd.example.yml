# AetherNet Daemon Configuration
# Copy to /etc/aethernet/daemon.yaml and customize.

# Unique node identifier — should be hostname or UUID
node_id: "node-1"

# Directory for Raft logs, FSM snapshots, SFTP host key
data_dir: "/var/lib/aethernet"

# Raft consensus transport
raft_bind_addr: "0.0.0.0:7000"
raft_advertise_addr: "10.0.0.1:7000"  # This node's public/LAN IP

# gRPC inter-node and plugin communication
grpc_listen: "0.0.0.0:7001"

# REST API and embedded web panel
http_listen: "0.0.0.0:8080"

# Native SFTP server (login: serverUUID.username)
sftp_listen: "0.0.0.0:2022"

# Prometheus metrics (internal — not exposed publicly)
metrics_listen: "127.0.0.1:9100"

# ─── Database ────────────────────────────────────────────────────────────────

mariadb_addr: "127.0.0.1:3306"
mariadb_db: "aethernet"
mariadb_user: "aethernet"
mariadb_pass: "CHANGEME"  # Generated by installer

# Redis Cluster addresses
redis_addrs:
  - "127.0.0.1:6379"
  # - "10.0.0.2:6379"
  # - "10.0.0.3:6379"

# ─── Docker / OCI Runtime ────────────────────────────────────────────────────

docker:
  endpoint: "unix:///var/run/docker.sock"
  scratch_path: "/var/lib/aethernet/scratch"
  template_path: "/var/lib/aethernet/templates"
  network_name: "aethernet"
  # Default port range for dynamic Minecraft server ports
  port_range_start: 25566
  port_range_end: 30000

# ─── HAProxy & VIP ───────────────────────────────────────────────────────────

haproxy:
  config_path: "/etc/haproxy/aethernet.cfg"
  max_conn_rate: 30     # connections per 3s per source IP before block
  max_conn_concurrent: 50
  enabled: true

keepalived:
  enabled: false          # Enable for multi-node VIP failover
  vip: "10.0.0.100"
  cidr_prefix: 24
  interface: "eth0"
  router_id: 51
  auth_pass: "CHANGEME"   # 8-char VRRP password

# ─── Backups / Snapshots ─────────────────────────────────────────────────────

snapshots:
  enabled: true
  schedule: "0 3 * * *"  # 03:00 daily
  s3:
    endpoint: "play.min.io"          # MinIO or S3 endpoint
    bucket: "aethernet-backups"
    access_key_id: "CHANGEME"
    secret_access_key: "CHANGEME"
    use_ssl: true
    region: "us-east-1"

# ─── RCON ────────────────────────────────────────────────────────────────────

rcon:
  # Default RCON port inside containers (exposed via Docker port mapping)
  default_port: 25575
  default_password: "aethernet-rcon-secret"

# ─── Mods / Plugins ──────────────────────────────────────────────────────────

mod_scanner:
  enabled: true
  scan_interval_minutes: 60
  curseforge_api_key: ""  # Required for CurseForge integration

# ─── Logging ─────────────────────────────────────────────────────────────────

log_level: "info"  # debug | info | warn | error
# Structured JSON logging (always enabled for production)
log_format: "json"  # json | text
