syntax = "proto3";

package aethernet.database.v1;

option go_package = "github.com/aethernet/aethernet/pkg/proto/database/v1;databasev1";

service DatabaseService {
  rpc Create     (CreateRequest)     returns (CreateResponse);
  rpc Drop       (DropRequest)       returns (DropResponse);
  rpc List       (ListRequest)       returns (ListResponse);
  rpc Query      (QueryRequest)      returns (QueryResponse);   // workbench
  rpc Tables     (TablesRequest)     returns (TablesResponse);
  rpc DescribeTable(DescribeTableRequest) returns (DescribeTableResponse);
}

enum Engine {
  ENGINE_UNSPECIFIED = 0;
  ENGINE_MYSQL       = 1;
  ENGINE_MARIADB     = 2; // identical wire protocol, surfaced separately for UI
}

message Database {
  string id         = 1;
  string name       = 2;
  Engine engine     = 3;
  string username   = 4;
  string host       = 5;
  uint32 port       = 6;
  int64  created_at = 7;
  uint64 size_bytes = 8;
}

message CreateRequest  { string name = 1; Engine engine = 2; string owner_user = 3; }
message CreateResponse { Database db = 1; string password = 2; } // password returned once
message DropRequest    { string id = 1; }
message DropResponse   { bool ok = 1; }
message ListRequest    {}
message ListResponse   { repeated Database dbs = 1; }

// Workbench
message QueryRequest {
  string database_id = 1;
  string sql         = 2;
  uint32 row_limit   = 3; // safety bound
}

message Column {
  string name = 1;
  string type = 2;
  bool   nullable = 3;
}

message Row {
  repeated string values = 1; // string-encoded; nulls represented by empty + null_mask
  uint64 null_mask        = 2; // bit per column, 1 = null
}

message QueryResponse {
  repeated Column columns = 1;
  repeated Row    rows    = 2;
  uint64 rows_affected    = 3;
  string error            = 4;
  uint64 duration_us      = 5;
}

message TablesRequest  { string database_id = 1; }
message TablesResponse { repeated string tables = 1; }
message DescribeTableRequest  { string database_id = 1; string table = 2; }
message DescribeTableResponse { repeated Column columns = 1; }
