version: "3.9"

# ─── AetherNet dev stack ─────────────────────────────────────────────────────
#
# Single-node development layout:
#   - mariadb     : single MariaDB instance (production uses Galera multi-master)
#   - redis       : single Redis node       (production uses Redis Cluster)
#   - daemon      : aether-daemon  (Raft + Docker controller + SFTP + REST/gRPC)
#   - panel       : aether-panel   (web panel + SPA proxy)
#
# Quick start:
#   cp .env.example .env          # adjust passwords etc.
#   docker compose up --build -d
#   open http://localhost:8080
# ─────────────────────────────────────────────────────────────────────────────

networks:
  aethernet:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  daemon_data:

services:

  # ── MariaDB (dev: single node) ────────────────────────────────────────────
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-aether_root}
      MYSQL_DATABASE:      ${MARIADB_DATABASE:-aethernet}
      MYSQL_USER:          ${MARIADB_USER:-aethernet}
      MYSQL_PASSWORD:      ${MARIADB_PASSWORD:-aether_pass}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./deploy/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    networks:
      - aethernet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis (dev: single node) ──────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aether_redis}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - aethernet
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-aether_redis}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── aether-daemon ─────────────────────────────────────────────────────────
  daemon:
    build:
      context: .
      dockerfile: daemon/Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AETHERNET_NODE_ID:        ${NODE_ID:-dev-node-1}
      AETHERNET_DATA_DIR:       /var/lib/aethernet
      AETHERNET_RAFT_BIND:      0.0.0.0:7000
      AETHERNET_RAFT_ADVERTISE: daemon:7000
      AETHERNET_GRPC_LISTEN:    0.0.0.0:7001
      AETHERNET_HTTP_LISTEN:    0.0.0.0:8081
      AETHERNET_SFTP_LISTEN:    0.0.0.0:2022
      AETHERNET_MARIADB_DSN:    "aethernet:${MARIADB_PASSWORD:-aether_pass}@tcp(mariadb:3306)/aethernet"
      AETHERNET_REDIS_ADDRS:    "redis:6379"
      AETHERNET_REDIS_PASSWORD: ${REDIS_PASSWORD:-aether_redis}
      AETHERNET_BOOTSTRAP:      ${BOOTSTRAP:-true}
    volumes:
      - daemon_data:/var/lib/aethernet
      - /var/run/docker.sock:/var/run/docker.sock   # Docker-in-Docker access
    ports:
      - "${RAFT_PORT:-7000}:7000"
      - "${GRPC_PORT:-7001}:7001"
      - "${DAEMON_HTTP_PORT:-8081}:8081"
      - "${SFTP_PORT:-2022}:2022"
    networks:
      - aethernet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── aether-panel ─────────────────────────────────────────────────────────
  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    restart: unless-stopped
    depends_on:
      daemon:
        condition: service_healthy
    environment:
      AETHERNET_DAEMON_URL: http://daemon:8081
      AETHERNET_LISTEN:     0.0.0.0:8080
    ports:
      - "${PANEL_PORT:-8080}:8080"
    networks:
      - aethernet
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
